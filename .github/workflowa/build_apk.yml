name: Flutter APK Build

on:
  push:
    branches:
      - main # Change to master if your default branch is master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code from repository
      - uses: actions/checkout@v4

      # 2. Set up Java environment required by Android
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter SDK environment
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Fetch dependencies
      - run: flutter pub get

      # 5. Compile the APK (Unsigned debug/release hybrid)
      - run: flutter build apk --debug

      # 6. Upload the finished APK file to GitHub so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-flutter-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
